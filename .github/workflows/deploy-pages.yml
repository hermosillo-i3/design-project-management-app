name: Deploy Pages
on:
  push:
    branches: [main, qas]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
      PROD_AUTH_DOMAIN: ${{ secrets.PROD_AUTH_DOMAIN }}
      PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
      PROD_STORAGE_BUCKET: ${{ secrets.PROD_STORAGE_BUCKET }}
      PROD_MESSAGING_SENDER_ID: ${{ secrets.PROD_MESSAGING_SENDER_ID }}
      PROD_APP_ID: ${{ secrets.PROD_APP_ID }}
      QAS_API_KEY: ${{ secrets.QAS_API_KEY }}
      QAS_AUTH_DOMAIN: ${{ secrets.QAS_AUTH_DOMAIN }}
      QAS_PROJECT_ID: ${{ secrets.QAS_PROJECT_ID }}
      QAS_STORAGE_BUCKET: ${{ secrets.QAS_STORAGE_BUCKET }}
      QAS_MESSAGING_SENDER_ID: ${{ secrets.QAS_MESSAGING_SENDER_ID }}
      QAS_APP_ID: ${{ secrets.QAS_APP_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod-src

      - name: Checkout qas
        uses: actions/checkout@v4
        with:
          ref: qas
          path: qas-src

      - name: Inject .env → index.html (prod y qas)
        working-directory: prod-src
        run: |
          node scripts/generate-firebase-config.mjs --ci
          node scripts/generate-firebase-config.mjs --ci --index ../qas-src/index.html

      - name: Build site
        run: |
          mkdir -p dist/qas
          cp prod-src/index.html dist/index.html
          cp qas-src/index.html dist/qas/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
