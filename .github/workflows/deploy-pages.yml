name: Deploy Pages
on:
  push:
    branches: [main, qas]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod-src

      - name: Checkout qas
        uses: actions/checkout@v4
        with:
          ref: qas
          path: qas-src

      - name: Build site
        run: |
          mkdir -p dist/qas
          cp prod-src/index.html dist/index.html
          cp qas-src/index.html dist/qas/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4